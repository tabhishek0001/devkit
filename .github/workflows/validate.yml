name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
      - name: Check required files
        run: |
          test -s index.html
          test -s assets/css/style.css
          test -s assets/js/app.js
          test -s assets/favicon.svg
      - name: Check all tools are registered
        run: |
          for tool in json base64 url jwt uuid hash timestamp regex html color; do
            grep -q "$tool:" assets/js/app.js
          done
